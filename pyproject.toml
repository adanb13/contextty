[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contextty"
version = "0.0.2"
description = "Database-agnostic context for AI agents: read-only snapshots, relationship graphs, and bounded profiling through CLI, API, and MCP."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Contextty Contributors" }]
keywords = ["ai", "agents", "mcp", "database", "schema", "metadata", "sql", "relational", "graph"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Database",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "click>=8.1",
  "fastapi>=0.100",
  "pydantic>=1.10",
  "uvicorn>=0.23",
  "networkx>=3.0",
  "psycopg[binary]>=3.1",
]

[project.urls]
Homepage = "https://github.com/adanb13/contextty"
Repository = "https://github.com/adanb13/contextty"
Issues = "https://github.com/adanb13/contextty/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "httpx>=0.24",
]
mcp = [
  "mcp>=1.0",
]

[project.scripts]
contextty = "contextty.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "integration: tests that require external services",
]
